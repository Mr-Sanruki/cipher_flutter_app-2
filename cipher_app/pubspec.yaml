name: cipher
description: A corporate chat application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Network
  dio: ^5.4.3

  socket_io_client: ^2.0.3+1

  # Stream (Voice Calling)
  stream_video_flutter: ^0.8.4

  # File Handling
  file_picker: ^8.0.0
  open_filex: ^4.3.4
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  flutter_pdfview: ^1.3.2
  video_player: ^2.8.6
  chewie: ^1.7.5

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  emoji_picker_flutter: ^4.4.0
  timeago: ^3.6.1
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  badges: ^3.1.2

  # Storage & Utils
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  share_plus: ^11.1.0
  clipboard: ^0.1.3
  image_cropper: ^11.0.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

